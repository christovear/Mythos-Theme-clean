<header class="site-header">
    {{ $siteAvatar := .Site.Params.custom_avatar | default .Site.Params.author.avatar }}
    <div class="header-container h-card">
        <div class="site-branding">
            <div class="site-info">
                <h1 class="site-title">
                    <a href="/" class="u-url" rel="home">
                        {{ if not .Site.Params.hide_profile_photo }}
                            {{ with $siteAvatar }}
                            <img src="{{ . }}" alt="{{ $.Site.Title }} logo" class="title-avatar u-photo" width="32" height="32">
                            {{ end }}
                        {{ end }}
                        <span class="p-name">{{ .Site.Title }}</span>
                    </a>
                </h1>
            </div>
        </div>
        <button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" title="Switch to dark mode">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.5"></circle>
                <path d="M12 3a9 9 0 0 1 0 18v-4.75a4.25 4.25 0 0 0 0-8.5V3z" fill="currentColor"></path>
                <path d="M12 7.75a4.25 4.25 0 0 0 0 8.5v-8.5z" fill="currentColor"></path>
            </svg>
        </button>
    </div>
</header>
