{{ $currentPage := .PageNumber }}
<form class="page-numbers pagination-jump" aria-label="Jump to a blog page">
    <label for="page-jump-{{ .PageNumber }}">{{ T "Page" }}</label>
    <select
        class="pagination-jump-input"
        id="page-jump-{{ .PageNumber }}"
        aria-label="Choose a page; currently page {{ .PageNumber }} of {{ .TotalPages }}">
        {{ range .Pagers }}
        <option value="{{ .URL }}"{{ if eq .PageNumber $currentPage }} selected{{ end }}>{{ .PageNumber }}</option>
        {{ end }}
    </select>
    <span>{{ T "Of" }} {{ .TotalPages }}</span>
    <button class="pagination-jump-submit" type="submit">{{ T "Go" }}</button>
</form>
<noscript>
    <span class="pagination-fallback" aria-label="Blog pages">
        {{ range .Pagers }}
        <a href="{{ .URL }}"{{ if eq .PageNumber $currentPage }} aria-current="page"{{ end }}>{{ .PageNumber }}</a>
        {{ end }}
    </span>
</noscript>
