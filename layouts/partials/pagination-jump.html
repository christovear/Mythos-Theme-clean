<form class="page-numbers pagination-jump" data-first-url="{{ .First.URL }}" aria-label="Jump to a blog page">
    <label for="page-jump-{{ .PageNumber }}">{{ T "Page" }}</label>
    <input
        class="pagination-jump-input"
        id="page-jump-{{ .PageNumber }}"
        type="number"
        inputmode="numeric"
        min="1"
        max="{{ .TotalPages }}"
        step="1"
        value="{{ .PageNumber }}"
        aria-label="Page number, from 1 to {{ .TotalPages }}">
    <span>{{ T "Of" }} {{ .TotalPages }}</span>
    <button class="pagination-jump-submit" type="submit">Go</button>
</form>
